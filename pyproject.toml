[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-reorder-columns"
version = "1.0.0"
description = "rewrite a CSV with its columns in a chosen order (drop/check/CI)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]

[project.scripts]
csv-reorder-columns = "csv_reorder_columns.cli:main"

[tool.setuptools.packages.find]
include = ["csv_reorder_columns*"]
